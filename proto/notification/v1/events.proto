syntax = "proto3";

package notification.v1;

option go_package = "notification-service/internal/events/notification/v1;notificationv1";

message NotificationRequested {
  string notification_id = 1;
  string producer = 2;
  string user_id = 3;
  string template_id = 4;
  string category = 5;
  string priority = 6;
  repeated string channels = 7;
  map<string, string> data = 8;
  int64 send_at = 9;
  int64 expires_at = 10;
  int64 created_at = 11;
}
