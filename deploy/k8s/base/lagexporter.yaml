apiVersion: apps/v1
kind: Deployment
metadata:
  name: lagexporter
  labels:
    app.kubernetes.io/name: lagexporter
    app.kubernetes.io/part-of: notification-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: lagexporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lagexporter
        app.kubernetes.io/part-of: notification-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lagexporter
          image: notif-lagexporter:latest
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: notif-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
