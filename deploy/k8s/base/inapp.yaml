apiVersion: apps/v1
kind: Deployment
metadata:
  name: inapp
  labels:
    app.kubernetes.io/name: inapp
    app.kubernetes.io/part-of: notification-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: inapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inapp
        app.kubernetes.io/part-of: notification-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inapp
      containers:
        - name: inapp
          image: notif-inapp:latest
          ports:
            - name: metrics
              containerPort: 9100
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: notif-config
            - secretRef:
                name: notif-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: inapp
  labels:
    app.kubernetes.io/name: inapp
spec:
  selector:
    app.kubernetes.io/name: inapp
  ports:
    - name: http
      port: 8083
      targetPort: http
