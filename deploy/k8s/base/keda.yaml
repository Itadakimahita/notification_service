apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-push
spec:
  scaleTargetRef:
    name: worker-push
  minReplicaCount: 2
  maxReplicaCount: 48
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.notifications.svc:9092
        consumerGroup: worker-push-high
        topic: notifications.dispatch.push.high
        lagThreshold: "200"
        activationLagThreshold: "10"
    - type: kafka
      metadata:
        bootstrapServers: kafka.notifications.svc:9092
        consumerGroup: worker-push-low
        topic: notifications.dispatch.push.low
        lagThreshold: "1000"
        activationLagThreshold: "10"
---
