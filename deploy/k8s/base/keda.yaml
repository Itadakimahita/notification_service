apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: router
spec:
  scaleTargetRef:
    name: router
  minReplicaCount: 3
  maxReplicaCount: 48
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.notifications.svc:9092
        consumerGroup: router
        topic: notifications.requested
        lagThreshold: "500"
        activationLagThreshold: "10"
---
