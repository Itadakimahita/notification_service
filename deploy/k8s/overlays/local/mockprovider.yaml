apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockprovider
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mockprovider }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mockprovider }
    spec:
      containers:
        - name: mockprovider
          image: notif-mockprovider:dev
          envFrom:
            - configMapRef: { name: notif-config }
          env:
            - { name: MOCK_WEBHOOK_URL, value: "http://status:8082/v1/webhooks/mock" }
          ports:
            - { name: http, containerPort: 9200 }
            - { name: metrics, containerPort: 9100 }
---
apiVersion: v1
kind: Service
metadata:
  name: mockprovider
spec:
  selector: { app.kubernetes.io/name: mockprovider }
  ports:
    - { name: http, port: 9200 }
